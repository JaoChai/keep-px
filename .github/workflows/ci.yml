name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            worker:
              - 'worker/**'
              - 'wrangler.jsonc'
              - 'package.json'
              - 'vitest.config.mts'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pixlinks
          POSTGRES_PASSWORD: pixlinks_dev
          POSTGRES_DB: pixlinks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixlinks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1
          working-directory: backend

      - name: guard client IP middleware
        run: |
          # Presence of ClientIPFromHeader("CF-Connecting-IP") is enforced by the
          # router test TestRouter_ForgedHeadersCannotBuyFreshBuckets
          # (internal/router/clientip_test.go), which fails when the middleware
          # is absent or commented out. This step guards against reintroducing
          # chimiddleware.RealIP, which trusts the client-supplied True-Client-IP
          # header — a second, independent failure mode the CF-Connecting-IP guard
          # below does not catch (RealIP overwrites RemoteAddr even when
          # ClientIPFromHeader is also registered).
          if grep -q 'chimiddleware.RealIP' internal/router/router.go; then
            echo "::error::router.go uses chimiddleware.RealIP — it trusts client-supplied True-Client-IP. Use ClientIPFromHeader(\"CF-Connecting-IP\"). See docs/superpowers/specs/2026-08-12-cloudflare-migration-design.md"
            exit 1
          fi

      - name: guard client IP header
        run: |
          if ! grep -q 'ClientIPFromHeader("CF-Connecting-IP")' internal/router/router.go; then
            echo "::error::router.go must resolve the client IP from CF-Connecting-IP. Any other header can be forged now that nginx is gone, and a wrong value silently breaks Meta CAPI attribution. See docs/superpowers/specs/2026-08-12-cloudflare-migration-design.md"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://pixlinks:pixlinks_dev@localhost:5432/pixlinks?sslmode=disable
        run: go test -race -tags=integration ./internal/repository/postgres/... -v

      - name: go build
        run: go build -o /dev/null ./cmd/server

      - name: gosec (security scanner)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: govulncheck (vulnerability scanner)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}

      - name: npm audit (security scan)
        continue-on-error: true
        run: npm audit --audit-level=high

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # typecheck borrows frontend's tsc, so its node_modules has to exist first
      - run: npm ci --prefix frontend
      # worker-configuration.d.ts is gitignored (generated) — tsc needs it for
      # the Cloudflare Workers ambient types (Env, ExecutionContext, etc.).
      # wrangler types reads secret key names from .dev.vars (placeholder
      # values only — no live Cloudflare account access needed or used).
      - run: cp .dev.vars.example .dev.vars
      - run: npx wrangler types
      - run: npx wrangler types --cwd workers/custom-domain
      - run: npm run typecheck
      - run: npm test

  ci-gate:
    if: always()
    needs: [backend, frontend, worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=("${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.worker.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Job failed with result: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"

  deploy:
    # always() is load-bearing, not decoration. Without it a push whose paths
    # skip both the backend and frontend jobs skips this one too, even though
    # ci-gate runs and succeeds — measured on dd7d92b, a worker-only change that
    # merged to main and never reached Cloudflare. The gate is still enforced by
    # the result check below: ci-gate reports failure if any job actually failed.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm ci --prefix frontend

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}

      - name: Verify health
        run: |
          URL="${{ vars.PROD_URL }}/health"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/10: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Verify security headers
        run: |
          H=$(curl -sI "${{ vars.PROD_URL }}/")
          for header in X-Content-Type-Options X-Frame-Options Referrer-Policy \
                        Permissions-Policy Strict-Transport-Security \
                        Cross-Origin-Opener-Policy Content-Security-Policy; do
            echo "$H" | grep -qi "^$header:" || { echo "::error::missing $header"; exit 1; }
          done
          echo "All 7 security headers present"

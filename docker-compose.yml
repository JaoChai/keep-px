services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixlinks
      POSTGRES_USER: pixlinks
      POSTGRES_PASSWORD: pixlinks_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pixlinks:pixlinks_dev@postgres:5432/pixlinks?sslmode=disable
      NEON_AUTH_URL: https://ep-ancient-brook-ain4f1ec.neonauth.c-4.us-east-1.aws.neon.tech/neondb/auth
      PORT: "8080"
      ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres

# The frontend service was removed with frontend/Dockerfile in 539974c — it is
# served by Workers Static Assets now. Local dev is `npm run dev --prefix frontend`.

volumes:
  pgdata:
